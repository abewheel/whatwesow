<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#142b20" />
    <meta
      name="description"
      content="Watch What We Sow, then build a farm and defend what you create. Play free in your browser."
    />
    <title>Watch What We Sow</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Watch What We Sow" />
    <meta
      property="og:description"
      content="Watch What We Sow, then build a farm and defend what you create. Play free in your browser."
    />
    <meta property="og:url" content="https://whatwesow.com/video" />
    <meta
      property="og:image"
      content="https://whatwesow.com/media/what-we-sow-social.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="What We Sow over a sunset farming valley"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://whatwesow.com/media/what-we-sow-social.jpg"
    />
    <link rel="canonical" href="https://whatwesow.com/video" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/video-page.css" />
  </head>
  <body>
    <div class="landscape" aria-hidden="true"></div>
    <div class="page">
      <header>
        <a class="brand" href="/" aria-label="What We Sow home">What We Sow</a>
        <a class="play" href="/" target="_blank" rel="noopener"
          >Play <span aria-hidden="true">↗</span></a
        >
      </header>
      <main>
        <div class="intro">
          <p class="eyebrow">A farming game about what’s yours.</p>
          <h1>Build a life worth defending.</h1>
        </div>
        <figure>
          <div class="screen">
            <video
              aria-label="What We Sow demo"
              autoplay
              muted
              playsinline
              loop
              controls
              preload="metadata"
              poster="/media/what-we-sow-demo.jpg"
              width="1920"
              height="1080"
            >
              <source src="/media/what-we-sow-demo.mp4" type="video/mp4" />
              Your browser cannot play this video.
              <a href="/">Play What We Sow</a>.
            </video>
          </div>
          <figcaption>One farm. A lifetime of choices.</figcaption>
        </figure>
      </main>
    </div>
  </body>
</html>
